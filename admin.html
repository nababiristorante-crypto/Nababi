<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nababi Ristorante | Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <main class="admin-wrap">
    <a class="brand" href="index.html">NABABI <span>RISTORANTE</span></a>

    <section class="panel" id="login-panel">
      <p class="eyebrow">SECURE AREA</p>
      <h1>Admin Login</h1>
      <p>Sign in using your Supabase user account.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username"
               value="Nababiristorante@gmail.com">

        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">

        <button class="button" type="submit">Sign In</button>
        <p id="login-message" role="status"></p>
      </form>
    </section>

    <section class="panel hidden" id="dashboard">
      <div class="dashboard-head">
        <div>
          <p class="eyebrow">CONTROL CENTRE</p>
          <h1>Dashboard</h1>
        </div>
        <button class="button secondary" id="signout" type="button">Sign Out</button>
      </div>

      <p id="admin-status"></p>
      <h2>Coupon Management</h2>
      <p>Manage restaurant coupons from the coupon manager.</p>
      <a class="button" href="coupon.box.html">Open Coupon Manager</a>
      <p class="small-note">Booking and menu management need their own database integration.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const cfg = window.NABABI_CONFIG;
    const client = cfg?.supabaseUrl && cfg?.supabaseAnonKey
      ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey)
      : null;

    const message = document.getElementById("login-message");
    const loginPanel = document.getElementById("login-panel");
    const dashboard = document.getElementById("dashboard");

    function showSession(session) {
      loginPanel.classList.toggle("hidden", Boolean(session));
      dashboard.classList.toggle("hidden", !session);

      if (session) {
        document.getElementById("admin-status").textContent =
          "Signed in as " + (session.user.email || "Admin");
      }
    }

    if (!client) {
      message.textContent = "Setup required: check config.js.";
    } else {
      client.auth.getSession().then(({ data, error }) => {
        if (error) message.textContent = error.message;
        showSession(data?.session || null);
      });

      client.auth.onAuthStateChange((_event, session) => {
        showSession(session);
      });
    }

    document.getElementById("login-form").addEventListener("submit", async event => {
      event.preventDefault();

      if (!client) {
        message.textContent = "Supabase configuration is missing.";
        return;
      }

      message.textContent = "Signing in…";

      const { error } = await client.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      message.textContent = error ? error.message : "";
    });

    document.getElementById("signout").addEventListener("click", async () => {
      if (!client) return;
      const { error } = await client.auth.signOut();
      if (error) message.textContent = error.message;
    });
  </script>
</body>
</html>
