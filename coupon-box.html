<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nababi | Coupon Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <main class="admin-wrap wide">
    <a class="brand" href="Admin.html">NABABI <span>RISTORANTE</span></a>

    <section class="panel">
      <p class="eyebrow">PROMOTIONS</p>
      <h1>Coupon Manager</h1>
      <p><a href="Admin.html">← Back to Admin</a></p>

      <form id="coupon-form" class="form-grid">
        <input type="hidden" id="coupon-id">

        <label>Coupon Code
          <input id="code" value="NABABI10" required maxlength="40">
        </label>

        <label>Discount Type
          <select id="discount-type">
            <option value="percent">Percentage (%)</option>
            <option value="fixed">Fixed Amount (€)</option>
          </select>
        </label>

        <label>Discount Value
          <input id="discount-value" type="number" min="0.01" step="0.01" value="10" required>
        </label>

        <label>Minimum Order (€)
          <input id="min-order" type="number" min="0" step="0.01" value="25" required>
        </label>

        <label>Expiry Date
          <input id="expires-at" type="date">
        </label>

        <label>Usage Limit
          <input id="usage-limit" type="number" min="0" step="1" value="100" required>
        </label>

        <label class="check">
          <input id="is-active" type="checkbox" checked> Active
        </label>

        <div>
          <button class="button" type="submit">Save Coupon</button>
          <button class="button secondary" type="button" id="reset">Clear</button>
        </div>
      </form>

      <p id="coupon-message" role="status"></p>
    </section>

    <section class="panel">
      <h2>Existing Coupons</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th><th>Discount</th><th>Minimum</th>
              <th>Expiry</th><th>Used / Limit</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="coupon-table-body">
            <tr><td colspan="7">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="coupons.js"></script>
</body>
</html>
