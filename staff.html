<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nababi Ristorante — Staff</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:
 radial-gradient(circle at top,#2a210c 0,#090909 38%);
 color:#f7f3e8;
 min-height:100vh;
}

:root{
 --gold:#d4af37;
 --gold2:#f5dc78;
 --green:#39d27a;
 --red:#ff625b;
 --card:#121212;
 --line:#292929;
}

button,input{
 font:inherit;
}

button{cursor:pointer}

.hidden{display:none!important}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.login-card{
 width:100%;
 max-width:430px;
 background:#111;
 border:1px solid #4a3914;
 border-radius:25px;
 padding:30px;
 text-align:center;
 box-shadow:0 25px 90px #000;
}

.logo{
 width:90px;
 height:90px;
 object-fit:cover;
 border-radius:50%;
 border:2px solid var(--gold);
}

h1,h2,h3{
 color:var(--gold2);
}

input{
 width:100%;
 padding:15px;
 border-radius:13px;
 border:1px solid #333;
 background:#080808;
 color:white;
 outline:none;
}

input:focus{
 border-color:var(--gold);
}

label{
 display:block;
 text-align:left;
 margin:15px 0 7px;
 color:#d6c789;
 font-size:14px;
}

.btn{
 border:0;
 border-radius:13px;
 padding:13px 18px;
 font-weight:bold;
}

.gold{
 background:linear-gradient(135deg,var(--gold),var(--gold2));
 color:#111;
}

.dark{
 background:#1b1b1b;
 border:1px solid #333;
 color:white;
}

.green{
 background:#173c27;
 color:#91ffbd;
 border:1px solid #347b50;
}

.red{
 background:#461818;
 color:#ffaba7;
 border:1px solid #823d3a;
}

.app{
 max-width:1000px;
 margin:auto;
 padding:20px;
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 margin-bottom:20px;
}

.profile{
 display:flex;
 align-items:center;
 gap:13px;
}

.avatar{
 width:60px;
 height:60px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid var(--gold);
 background:#171717;
}

.role{
 color:#999;
 font-size:13px;
}

.code-card{
 background:
 linear-gradient(145deg,#17120a,#0e0e0e);
 border:2px solid #5b4614;
 border-radius:28px;
 padding:30px 20px;
 text-align:center;
 box-shadow:0 20px 70px #000;
 margin-bottom:20px;
}

.code-icon{
 width:100px;
 height:100px;
 border-radius:50%;
 margin:0 auto 15px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:48px;
 background:#20190a;
 border:2px solid var(--gold);
}

.code-card h1{
 font-size:31px;
 margin:8px 0;
}

.code-card p{
 color:#999;
}

.code-input{
 font-size:28px;
 text-align:center;
 letter-spacing:3px;
 border:2px solid #4b3a12;
 margin:15px 0;
 text-transform:uppercase;
}

.result{
 border-radius:20px;
 padding:20px;
 margin-top:20px;
 text-align:center;
}

.result.valid{
 background:#102619;
 border:1px solid #2e7547;
}

.result.invalid{
 background:#301414;
 border:1px solid #7d3430;
}

.result.used{
 background:#30250d;
 border:1px solid #80601c;
}

.result-icon{
 font-size:42px;
}

.discount{
 font-size:40px;
 color:var(--gold2);
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.stat{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:18px;
 padding:20px;
 text-align:center;
}

.stat small{
 color:#888;
}

.stat strong{
 display:block;
 color:var(--gold2);
 font-size:30px;
 margin-top:7px;
}

.activity{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:18px;
 padding:20px;
 margin-top:20px;
}

.activity-row{
 padding:12px 0;
 border-bottom:1px solid #252525;
 display:flex;
 justify-content:space-between;
 gap:10px;
}

@media(max-width:600px){
 .stats{grid-template-columns:1fr}
 .code-card h1{font-size:26px}
 .code-input{font-size:22px}
}
</style>
</head>

<body>

<div id="loginScreen" class="login">
 <div class="login-card">

  <img id="loginLogo" class="logo" src="" alt="Nababi">

  <h1>Nababi Ristorante</h1>
  <p style="color:#999">Staff Panel</p>

  <label>Email</label>
  <input id="email" type="email" placeholder="Staff email">

  <label>Password</label>
  <input id="password" type="password" placeholder="Password">

  <button class="btn gold" style="width:100%;margin-top:18px"
   onclick="login()">
   🔐 Staff Login
  </button>

  <p id="error" style="color:#ff7770"></p>

 </div>
</div>


<div id="app" class="app hidden">

 <div class="top">

  <div class="profile">
   <img id="avatar" class="avatar" src="" alt="">
   <div>
    <h3 id="staffName" style="margin:0">Staff</h3>
    <div id="staffEmail" class="role"></div>
    <div id="staffRole" class="role"></div>
   </div>
  </div>

  <button class="btn dark" onclick="logout()">🚪 Logout</button>

 </div>


 <!-- BIG DISCOUNT CODE OPTION -->

 <div class="code-card">

  <div class="code-icon">🎟️</div>

  <h1>DISCOUNT CODE</h1>

  <p>
   Customer যে Discount Code দিয়েছে সেটি এখানে লিখুন।
  </p>

  <input
   id="codeInput"
   class="code-input"
   placeholder="NB-000001"
   autocomplete="off"
   maxlength="30"
  >

  <div class="row">
   <button class="btn gold"
    style="width:100%;font-size:18px"
    onclick="checkCode()">
    🔍 CHECK CODE
   </button>
  </div>

  <div id="result"></div>

 </div>


 <!-- STATS -->

 <div class="stats">

  <div class="stat">
   <small>Today Checked</small>
   <strong id="todayChecked">0</strong>
  </div>

  <div class="stat">
   <small>Codes Used</small>
   <strong id="totalUsed">0</strong>
  </div>

  <div class="stat">
   <small>Invalid</small>
   <strong id="invalid">0</strong>
  </div>

 </div>


 <!-- RECENT ACTIVITY -->

 <div class="activity">

  <h2>Recent Activity</h2>

  <div id="activityList">
   <p style="color:#777">Loading...</p>
  </div>

 </div>

</div>


<script>
const sb=window.supabase.createClient(
 window.SUPABASE_URL,
 window.SUPABASE_ANON_KEY
);

let user=null;
let staff=null;
let lastCode=null;

const $=id=>document.getElementById(id);

function escapeHtml(value){
 return String(value??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function normalizeCode(v){
 return String(v||"").trim().toUpperCase();
}

async function login(){

 const email=$("email").value.trim();
 const password=$("password").value;

 $("error").textContent="";

 const {data,error}=await sb.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  $("error").textContent=error.message;
  return;
 }

 user=data.user;

 await loadStaff();
}

async function loadStaff(){

 const {data,error}=await sb
  .from("admin_staff")
  .select("*")
  .ilike("email",user.email)
  .maybeSingle();

 if(error||!data){
  await sb.auth.signOut();
  $("error").textContent="Staff account পাওয়া যায়নি।";
  return;
 }

 if(data.enabled!==true){
  await sb.auth.signOut();
  $("error").textContent="এই account disabled.";
  return;
 }

 staff=data;

 if(staff.role!=="DISCOUNT_STAFF"){
  if(staff.role==="SUPER_ADMIN"){
   location.href="admin.html";
  }else{
   $("error").textContent="এই panel আপনার role-এর জন্য নয়।";
   await sb.auth.signOut();
  }
  return;
 }

 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");

 $("staffName").textContent=staff.full_name||"Staff";
 $("staffEmail").textContent=staff.email;
 $("staffRole").textContent="DISCOUNT STAFF";

 if(staff.avatar_url){
  $("avatar").src=staff.avatar_url;
  $("loginLogo").src=staff.avatar_url;
 }else{
  $("avatar").src="data:image/svg+xml;charset=UTF-8,"+
   encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
     <rect width="100" height="100" fill="#171717"/>
     <text x="50" y="60" text-anchor="middle" font-size="45">👤</text>
    </svg>
   `);
 }

 await loadStats();
 await loadActivity();
}

async function checkCode(){

 const code=normalizeCode($("codeInput").value);

 if(!code){
  showResult("invalid","❌","Code লিখুন","Please enter a discount code.");
  return;
 }

 lastCode=code;

 const {data,error}=await sb.rpc(
  "use_discount_code",
  {p_code:code}
 );

 /*
  The function may return different shapes depending
  on the SQL version. We handle the common ones below.
 */

 if(error){

  await logActivity(code,"INVALID");

  showResult(
   "invalid",
   "❌",
   "INVALID CODE",
   error.message||"এই code valid নয়।"
  );

  await loadStats();
  await loadActivity();

  return;
 }

 let row=Array.isArray(data)?data[0]:data;

 if(!row){

  await logActivity(code,"INVALID");

  showResult(
   "invalid",
   "❌",
   "INVALID CODE",
   "এই Discount Code পাওয়া যায়নি।"
  );

  await loadStats();
  await loadActivity();

  return;
 }

 const status=String(
  row.status||row.result||row.message||""
 ).toLowerCase();

 if(status.includes("used")||status.includes("already")){

  await logActivity(code,"CHECKED");

  showResult(
   "used",
   "⚠️",
   "ALREADY USED",
   "এই Discount Code আগে ব্যবহার করা হয়েছে।"
  );

  await loadStats();
  await loadActivity();

  return;
 }

 const discount=
  row.discount_percent ??
  row.discount ??
  row.percent ??
  "";

 await logActivity(code,"CHECKED");

 showResult(
  "valid",
  "✅",
  "VALID CODE",
  discount
   ? `<div class="discount">${escapeHtml(discount)}%</div>
      <p>Customer discount পাবে।</p>`
   : "<p>Customer-এর জন্য code valid.</p>",
  true
 );

 await loadStats();
 await loadActivity();
}

function showResult(type,icon,title,text,canUse=false){

 $("result").className="result "+type;

 $("result").innerHTML=`
  <div class="result-icon">${icon}</div>
  <h2>${title}</h2>
  <div>${text}</div>

  ${canUse
   ? `<button
       class="btn green"
       style="margin-top:15px;width:100%;font-size:17px"
       onclick="markUsed()">
       ✓ MARK AS USED
      </button>`
   : ""}
 `;
}

async function markUsed(){

 if(!lastCode)return;

 /*
  Calling the same SQL function again may consume the code.
  To prevent accidental double use, ask for confirmation.
 */
 if(!confirm("এই Discount Code এখন Used হিসেবে mark করবেন?"))
  return;

 const code=lastCode;

 const {data,error}=await sb.rpc(
  "use_discount_code",
  {p_code:code}
 );

 if(error){
  showResult(
   "invalid",
   "❌",
   "FAILED",
   error.message
  );
  return;
 }

 await logActivity(code,"USED");

 showResult(
  "used",
  "✓",
  "CODE USED",
  "এই Discount Code successfully used হয়েছে।"
 );

 $("codeInput").value="";
 lastCode=null;

 await loadStats();
 await loadActivity();
}

async function logActivity(code,action){

 if(!staff)return;

 await sb.from("discount_staff_activity").insert({
  staff_email:staff.email,
  staff_name:staff.full_name||"",
  discount_code:code,
  action
 });
}

async function loadStats(){

 if(!staff)return;

 const today=new Date();
 today.setHours(0,0,0,0);

 const {data}=await sb
  .from("discount_staff_activity")
  .select("action,created_at")
  .eq("staff_email",staff.email);

 const rows=data||[];

 const todayRows=rows.filter(x=>
  new Date(x.created_at)>=today
 );

 $("todayChecked").textContent=
  todayRows.filter(x=>x.action==="CHECKED").length;

 $("totalUsed").textContent=
  rows.filter(x=>x.action==="USED").length;

 $("invalid").textContent=
  rows.filter(x=>x.action==="INVALID").length;
}

async function loadActivity(){

 if(!staff)return;

 const {data,error}=await sb
  .from("discount_staff_activity")
  .select("*")
  .eq("staff_email",staff.email)
  .order("created_at",{ascending:false})
  .limit(20);

 if(error){
  $("activityList").innerHTML=
   `<p style="color:#ff7770">${escapeHtml(error.message)}</p>`;
  return;
 }

 if(!data?.length){
  $("activityList").innerHTML=
   '<p style="color:#777">No activity yet.</p>';
  return;
 }

 $("activityList").innerHTML=data.map(a=>`

  <div class="activity-row">

   <div>
    <b>${escapeHtml(a.discount_code)}</b><br>

    <small style="color:#777">
     ${new Date(a.created_at).toLocaleString()}
    </small>
   </div>

   <div>
    ${
     a.action==="USED"
      ? '<span style="color:#6dff9e">USED</span>'
      : a.action==="INVALID"
       ? '<span style="color:#ff7770">INVALID</span>'
       : '<span style="color:#e7cf6e">CHECKED</span>'
    }
   </div>

  </div>

 `).join("");
}

async function logout(){
 await sb.auth.signOut();
 location.reload();
}

$("codeInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")checkCode();
});

(async function init(){

 const {data}=await sb.auth.getSession();

 if(data?.session?.user){
  user=data.session.user;
  await loadStaff();
 }

})();
</script>

</body>
</html>
